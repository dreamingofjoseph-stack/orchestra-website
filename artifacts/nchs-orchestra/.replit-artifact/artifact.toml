kind = "web"
previewPath = "/"
title = "NCHS Orchestra"
version = "1.0.0"
id = "artifacts/nchs-orchestra"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19694

[services.development]
run = "pnpm --filter @workspace/nchs-orchestra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nchs-orchestra", "run", "build" ]
publicDir = "artifacts/nchs-orchestra/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19694"
BASE_PATH = "/"
